<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>SHARP LINE — Telegram</title>
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230A0A0A'/%3E%3Ctext x='50' y='72' text-anchor='middle' font-family='Arial' font-weight='900' font-size='64' fill='%2339FF14'%3ES%3C/text%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0A0A0A;color:#fff;font-family:Montserrat,Arial,sans-serif;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background:radial-gradient(420px 420px at 50% 30%,rgba(57,255,20,.14),transparent 70%),#0A0A0A}
.w{width:100%;max-width:380px;text-align:center}
.logo{width:96px;height:96px;margin:0 auto 18px;border-radius:26px;background:#111;border:1px solid #1f1f1f;
  display:flex;align-items:center;justify-content:center;font-size:62px;font-weight:900;color:#fff;
  text-shadow:0 0 24px rgba(57,255,20,.5)}
h1{font-size:22px;font-weight:800;letter-spacing:4px}
h1 b{color:#39FF14}
p{color:#a8a8a8;font-size:15px;line-height:1.5;margin:12px 0 26px}
.spin{width:22px;height:22px;border:3px solid #2a2a2a;border-top-color:#39FF14;border-radius:50%;
  display:inline-block;vertical-align:middle;margin-right:8px;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:18px;border-radius:16px;
  background:#39FF14;color:#061006;font-size:18px;font-weight:900;text-decoration:none;
  box-shadow:0 0 34px rgba(57,255,20,.35)}
.btn svg{width:24px;height:24px}
.alt{display:block;margin-top:14px;padding:14px;border-radius:14px;border:1px solid #2a2a2a;color:#d0d0d0;
  font-size:15px;font-weight:700;text-decoration:none}
.small{margin-top:22px;font-size:12px;color:#6b6b6b}
</style>
</head>
<body>
<div class="w">
  <div class="logo">S</div>
  <h1>SHARP <b>LINE</b></h1>
  <p id="msg"><span class="spin"></span>Telegram ochilmoqda…</p>
  <a class="btn" id="open" href="https://t.me/SharpLineUz_bot">
    <svg viewBox="0 0 24 24" fill="#061006"><path d="M21.9 4.3 18.7 19.4c-.2 1.1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.3-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.2 13.1 1.4 11.6c-1-.3-1.1-1 .2-1.5L20.6 2.8c.9-.3 1.6.2 1.3 1.5z"/></svg>
    Telegram'da ochish
  </a>
  <a class="alt" id="web" href="https://t.me/SharpLineUz_bot">Ochilmasa — shu yerni bosing</a>
  <a class="alt" id="store" href="https://play.google.com/store/apps/details?id=org.telegram.messenger">Telegram yo'qmi? Yuklab olish</a>
  <div class="small">Bot ochilgach <b>START</b> tugmasini bosing · 18+</div>
</div>
<script>
(function () {
  var BOT = "SharpLineUz_bot";
  var q = new URLSearchParams(location.search);
  var s = (q.get("s") || "ads_go").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 64) || "ads_go";
  var ua = navigator.userAgent || "";
  var android = /Android/i.test(ua), ios = /iPhone|iPad|iPod/i.test(ua);
  var web = "https://t.me/" + BOT + "?start=" + s;
  var tg = "tg://resolve?domain=" + BOT + "&start=" + s;
  var intent = "intent://resolve?domain=" + BOT + "&start=" + s +
    "#Intent;scheme=tg;package=org.telegram.messenger;S.browser_fallback_url=" + encodeURIComponent(web) + ";end";
  var app = android ? intent : (ios ? tg : web);

  document.getElementById("open").href = app;
  document.getElementById("web").href = web;
  if (ios) document.getElementById("store").href = "https://apps.apple.com/app/telegram-messenger/id686449807";

  // Пробуем открыть приложение сразу; если браузер не пустил без нажатия — остаются кнопки
  setTimeout(function () { try { location.href = app; } catch (e) {} }, 150);
  setTimeout(function () {
    document.getElementById("msg").textContent = "Pastdagi tugmani bosing — bot Telegram'da ochiladi.";
  }, 2500);
})();
</script>
</body>
</html>
